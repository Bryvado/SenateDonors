name: Refresh FEC data and publish map

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: senate-donors-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check FEC for new or amended filings
        if: github.event_name != 'push'
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python3 scripts/update_data.py
      # Content hashes of the boundary files; browsers keep a file cached until its hash changes.
      - name: Update boundary manifest
        run: python3 scripts/build_manifest.py
      - name: Commit only changed data
        if: github.event_name != 'push'
        run: |
          git add data/receipts.csv data/state_totals.csv data/coverage.json data/filings.json data/state_monthly.csv data/levels/*.csv data/manifest.json
          if ! git diff --cached --quiet; then
            git config user.name 'senate-donors-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh reconciled FEC filings'
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css app.js _site/
          cp -R data vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
